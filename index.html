<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e8f0fe">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="小账本">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="小账本">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <title>小账本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-font-smoothing: antialiased;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
            background: #fafbfc; color: #1a1a2e;
        }

        #app {
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
            max-width: 480px; margin: 0 auto;
            position: relative; overflow: hidden;
        }

        /* ============ 页面容器 ============ */
        .page {
            flex: 1; overflow-y: auto;
            display: none; -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .page.active { display: block; }
        .page-content { padding: 0 16px 20px; }

        /* ============ V0.2 首页 ============ */
        .home-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 16px 4px; font-size: 18px; font-weight: 600;
            color: #1a1a2e; letter-spacing: 0.5px;
        }
        .home-header .month { font-size: 14px; font-weight: 400; color: #8e8e93; }

        /* 主卡 */
        .main-card {
            background: #fff; border-radius: 16px; padding: 20px;
            margin: 8px 0 16px;
            border: 1px solid #eef0f2;
            display: flex; justify-content: space-between; position: relative;
            min-height: 140px;
        }
        .main-card-left { flex: 1; padding-right: 10px; }
        .main-card-left .label { font-size: 14px; color: #8e8e93; margin-bottom: 4px; }
        .main-card-left .amount {
            font-size: 32px; font-weight: 700; color: #1a1a2e;
            letter-spacing: -0.5px; line-height: 1.2;
        }
        .main-card-left .amount .unit { font-size: 18px; font-weight: 600; }
        .main-card-left .sub-label {
            font-size: 13px; color: #8e8e93; margin-top: 12px;
        }
        .main-card-left .sub-amount {
            font-size: 16px; font-weight: 600; color: #aaa;
            margin-top: 2px;
        }
        .main-card-right {
            flex-shrink: 0; display: flex; align-items: flex-end;
            justify-content: flex-end;
        }
        .main-card-right img {
            width: 140px; height: auto;
            object-fit: contain;
        }

        /* 四个归属 */
        .owner-section {
            margin: 0 -4px 16px; display: flex;
            gap: 0; justify-content: space-between;
        }
        .owner-item {
            flex: 1; text-align: center; padding: 8px 2px;
            background: #fff; border-radius: 12px; margin: 0 4px;
            border: 1px solid #f0f2f4;
        }
        .owner-item img {
            width: 36px; height: 36px; object-fit: contain;
            margin-bottom: 4px;
        }
        .owner-item .name { font-size: 12px; color: #8e8e93; line-height: 1.3; }
        .owner-item .amount {
            font-size: 14px; font-weight: 600; color: #1a1a2e;
            margin-top: 2px;
        }
        .owner-item.unclassified {
            border-color: transparent;
            background: transparent;
        }
        .owner-item.unclassified .amount { color: #c7c7cc; font-size: 12px; }

        /* 待还入口 */
        .debt-entry {
            background: #fff; border-radius: 12px; padding: 14px 16px;
            margin-bottom: 16px; border: 1px solid #f0f2f4;
            display: flex; justify-content: space-between; align-items: center;
        }
        .debt-entry-left { flex: 1; }
        .debt-entry-title {
            font-size: 14px; font-weight: 500; color: #1a1a2e;
            margin-bottom: 6px;
        }
        .debt-entry-row {
            display: flex; gap: 16px; align-items: center;
        }
        .debt-entry-row .item {
            font-size: 12px; color: #8e8e93;
        }
        .debt-entry-row .item .num {
            font-size: 14px; font-weight: 600; color: #1a1a2e;
        }
        .debt-entry-arrow {
            font-size: 18px; color: #c7c7cc; padding-left: 8px;
        }

        /* 最近记下 */
        .recent-title {
            font-size: 15px; font-weight: 600; color: #1a1a2e;
            margin-bottom: 10px;
        }
        .recent-list { }
        .recent-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #f0f2f4;
        }
        .recent-item:last-child { border-bottom: none; }
        .recent-item-left { flex: 1; }
        .recent-item-category {
            font-size: 14px; font-weight: 500; color: #1a1a2e;
        }
        .recent-item-meta {
            font-size: 11px; color: #c7c7cc; margin-top: 2px;
        }
        .recent-item-amount {
            font-size: 15px; font-weight: 600; color: #1a1a2e;
        }
        .recent-empty {
            text-align: center; padding: 24px 0; color: #c7c7cc;
            font-size: 13px;
        }

        /* ============ 底部导航（V0.2 五栏） ============ */
        .tab-bar {
            display: flex; align-items: flex-start;
            background: #fff; border-top: 1px solid #eef0f2;
            padding: 0 0 env(safe-area-inset-bottom, 0);
            position: relative;
            flex-shrink: 0;
        }
        .tab-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; padding: 6px 0 4px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .tab-item .tab-icon {
            font-size: 20px; line-height: 1; margin-bottom: 2px;
            color: #c7c7cc;
        }
        .tab-item .tab-label {
            font-size: 10px; color: #c7c7cc; font-weight: 500;
        }
        .tab-item.active .tab-icon { color: #5b8def; }
        .tab-item.active .tab-label { color: #5b8def; }

        /* 中间 + 按钮 */
        .tab-add-wrap {
            flex: 0 0 auto; display: flex; justify-content: center;
            align-items: center; position: relative;
            width: 60px; margin-top: -12px;
        }
        .tab-add {
            width: 48px; height: 48px; border-radius: 50%;
            background: #5b8def; border: 3px solid #fafbfc;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 300; color: #fff;
            cursor: pointer; box-shadow: 0 2px 8px rgba(91, 141, 239, 0.3);
            -webkit-tap-highlight-color: transparent;
        }
        .tab-add:active { transform: scale(0.95); }

        /* ============ 记一笔（保留 V0.1 样式） ============ */
        .add-header { padding: 16px 16px 8px; display: flex; justify-content: space-between; }
        .add-header .back-btn { font-size: 16px; color: #5b8def; cursor: pointer; }
        .add-header .title { font-size: 17px; font-weight: 600; color: #1a1a2e; }
        .add-header .spacer { width: 40px; }
        .add-form { padding: 0 16px 16px; }
        .type-toggle { display: flex; gap: 0; margin-bottom: 16px; }
        .type-btn { flex: 1; padding: 8px; text-align: center; font-size: 14px; border: 1px solid #e8ecf0; background: #fff; color: #8e8e93; cursor: pointer; }
        .type-btn:first-child { border-radius: 8px 0 0 8px; }
        .type-btn:last-child { border-radius: 0 8px 8px 0; }
        .type-btn.active { background: #5b8def; color: #fff; border-color: #5b8def; }
        .amount-input-wrap { margin-bottom: 16px; }
        .amount-input-wrap input {
            width: 100%; padding: 16px; font-size: 28px; font-weight: 700;
            border: 1px solid #e8ecf0; border-radius: 12px; outline: none;
            text-align: center; font-family: inherit;
        }
        .amount-input-wrap input:focus { border-color: #5b8def; }
        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
        .category-btn {
            padding: 12px 4px; text-align: center; border: 1px solid #e8ecf0;
            border-radius: 10px; background: #fff; cursor: pointer; font-size: 13px; color: #1a1a2e;
        }
        .category-btn .icon { font-size: 22px; display: block; margin-bottom: 4px; }
        .category-btn.selected { border-color: #5b8def; background: #f0f4ff; }
        .form-row { margin-bottom: 12px; }
        .form-row label { font-size: 13px; color: #8e8e93; display: block; margin-bottom: 4px; }
        .form-row input, .form-row textarea {
            width: 100%; padding: 10px 12px; font-size: 15px;
            border: 1px solid #e8ecf0; border-radius: 8px; outline: none; font-family: inherit;
        }
        .form-row input:focus, .form-row textarea:focus { border-color: #5b8def; }
        .save-btn {
            width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
            background: #5b8def; color: #fff; border: none; border-radius: 12px;
            cursor: pointer; margin-top: 8px;
        }
        .save-btn:active { opacity: 0.85; }

        /* ============ 流水页（保留 V0.1 样式，适配新数据） ============ */
        .list-filters { display: flex; gap: 8px; padding: 12px 16px; }
        .filter-chip {
            padding: 6px 14px; border-radius: 16px; font-size: 13px;
            border: 1px solid #e8ecf0; background: #fff; color: #8e8e93; cursor: pointer;
        }
        .filter-chip.active { background: #5b8def; color: #fff; border-color: #5b8def; }
        .list-items { padding: 0 16px; }
        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #f0f2f4;
        }
        .list-item-left { flex: 1; }
        .list-item-category { font-size: 14px; font-weight: 500; color: #1a1a2e; }
        .list-item-meta { font-size: 11px; color: #c7c7cc; margin-top: 2px; }
        .list-item-amount { font-size: 15px; font-weight: 600; }
        .list-item-amount.expense { color: #1a1a2e; }
        .list-item-amount.income { color: #34c759; }
        .list-item-actions { display: flex; gap: 6px; margin-left: 8px; }
        .item-btn {
            padding: 4px 8px; font-size: 12px; border: none; border-radius: 6px;
            cursor: pointer; background: #f0f2f4; color: #8e8e93;
        }
        .item-btn.edit { color: #5b8def; }
        .item-btn.delete { color: #ff6b6b; }

        /* ============ 分析页（保留 V0.1） ============ */
        .analysis-summary { display: flex; gap: 8px; padding: 16px; }
        .analysis-card { flex: 1; background: #fff; border-radius: 12px; padding: 12px; border: 1px solid #f0f2f4; }
        .analysis-card .label { font-size: 12px; color: #8e8e93; }
        .analysis-card .amount { font-size: 18px; font-weight: 700; margin-top: 4px; }
        .analysis-card .amount.income { color: #34c759; }
        .analysis-card .amount.expense { color: #1a1a2e; }
        .analysis-card .amount.balance { color: #5b8def; }
        .month-nav {
            display: flex; align-items: center; justify-content: center;
            gap: 16px; padding: 8px 16px;
        }
        .month-nav-btn { font-size: 20px; color: #5b8def; cursor: pointer; padding: 4px; }
        .month-nav-label { font-size: 15px; font-weight: 600; color: #1a1a2e; min-width: 100px; text-align: center; }
        .chart-placeholder { padding: 16px; }
        .data-mgmt { padding: 16px; display: flex; gap: 10px; }
        .data-mgmt-btn {
            flex: 1; padding: 10px; font-size: 13px; border: 1px solid #e8ecf0;
            border-radius: 8px; background: #fff; cursor: pointer; color: #1a1a2e;
        }

        /* ============ 待还占位页 ============ */
        .placeholder-page {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 60px 20px; color: #c7c7cc;
        }
        .placeholder-page .icon { font-size: 48px; margin-bottom: 12px; }
        .placeholder-page .text { font-size: 14px; }

        /* ============ 弹窗 ============ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 100; display: none;
        }
        .modal-overlay.active { display: block; }
        .modal-content {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #fff; border-radius: 16px 16px 0 0;
            z-index: 101; padding: 20px; max-height: 80vh; overflow-y: auto;
            display: none; max-width: 480px; margin: 0 auto;
        }
        .modal-content.active { display: block; }
        .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 16px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .modal-actions button {
            flex: 1; padding: 12px; border-radius: 10px; font-size: 15px;
            border: none; cursor: pointer; font-weight: 500;
        }
        .modal-actions .cancel-btn { background: #f0f2f4; color: #8e8e93; }
        .modal-actions .confirm-btn { background: #5b8def; color: #fff; }
        .modal-actions .confirm-btn.danger { background: #ff6b6b; }
    </style>
</head>
<body>
    <div id="app">
        <!-- ========== 首页（V0.2） ========== -->
        <div class="page active" id="page-home">
            <div class="home-header">
                <span>小账本</span>
                <span class="month" id="homeMonth">8月</span>
            </div>
            <div class="page-content">
                <!-- 主卡 -->
                <div class="main-card">
                    <div class="main-card-left">
                        <div class="label">这个月花了</div>
                        <div class="amount" id="homeTotalExpense"><span class="unit">¥</span>0</div>
                        <div class="sub-label">还能用</div>
                        <div class="sub-amount" id="homeRemaining">—</div>
                    </div>
                    <div class="main-card-right">
                        <img src="icons/vase.png" alt="花瓶" id="vaseImg">
                    </div>
                </div>

                <!-- 四个归属 -->
                <div class="owner-section" id="ownerSection">
                    <div class="owner-item" data-owner="self">
                        <img src="icons/owner_self.png" alt="自己">
                        <div class="name">自己</div>
                        <div class="amount">¥0</div>
                    </div>
                    <div class="owner-item" data-owner="family">
                        <img src="icons/owner_family.png" alt="家里">
                        <div class="name">家里</div>
                        <div class="amount">¥0</div>
                    </div>
                    <div class="owner-item" data-owner="son">
                        <img src="icons/owner_son.png" alt="儿子">
                        <div class="name">儿子</div>
                        <div class="amount">¥0</div>
                    </div>
                    <div class="owner-item" data-owner="studio">
                        <img src="icons/owner_studio.png" alt="工作室">
                        <div class="name">工作室</div>
                        <div class="amount">¥0</div>
                    </div>
                </div>

                <!-- 待还入口 -->
                <div class="debt-entry" id="debtEntry">
                    <div class="debt-entry-left">
                        <div class="debt-entry-title">还有这些要还</div>
                        <div class="debt-entry-row">
                            <span class="item">待还总额 <span class="num" id="debtTotal">¥0</span></span>
                            <span class="item">本月要还 <span class="num" id="debtMonthly">¥0</span></span>
                        </div>
                    </div>
                    <div class="debt-entry-arrow">›</div>
                </div>

                <!-- 最近记下 -->
                <div class="recent-title">最近记下</div>
                <div class="recent-list" id="recentList">
                    <div class="recent-empty">还没有记录，记一笔吧</div>
                </div>
            </div>
        </div>

        <!-- ========== 记一笔（保留 V0.1） ========== -->
        <div class="page" id="page-add">
            <div class="add-header">
                <span class="spacer"></span>
                <span class="title">记一笔</span>
                <span class="back-btn" onclick="switchPage('home')">✕</span>
            </div>
            <div class="add-form">
                <div class="type-toggle">
                    <div class="type-btn active" data-type="expense">支出</div>
                    <div class="type-btn" data-type="income">收入</div>
                </div>
                <div class="amount-input-wrap">
                    <input type="number" id="amountInput" inputmode="decimal" pattern="[0-9]*" placeholder="0.00" step="0.01">
                </div>
                <div class="category-grid" id="addCategories">
                    <div class="category-btn" data-cat="necessities_food"><span class="icon">🍚</span>温饱</div>
                    <div class="category-btn selected" data-cat="treat_food"><span class="icon">🍰</span>贪吃</div>
                    <div class="category-btn" data-cat="shopping"><span class="icon">🛍️</span>买买</div>
                    <div class="category-btn" data-cat="transport"><span class="icon">🚗</span>出行</div>
                    <div class="category-btn" data-cat="learning"><span class="icon">📚</span>学习</div>
                    <div class="category-btn" data-cat="household"><span class="icon">🏠</span>家用</div>
                    <div class="category-btn" data-cat="health"><span class="icon">💊</span>健康</div>
                    <div class="category-btn" data-cat="fun"><span class="icon">🎮</span>玩乐</div>
                </div>
                <div class="form-row">
                    <label>日期</label>
                    <input type="date" id="dateInput">
                </div>
                <div class="form-row">
                    <label>＋ 加句话</label>
                    <input type="text" id="noteInput" placeholder="可选">
                </div>
                <button class="save-btn" id="saveBtn">记下</button>
            </div>
        </div>

        <!-- ========== 流水页（保留 V0.1） ========== -->
        <div class="page" id="page-list">
            <div class="list-filters">
                <span class="filter-chip active" data-filter="all">全部</span>
                <span class="filter-chip" data-filter="expense">支出</span>
                <span class="filter-chip" data-filter="income">收入</span>
            </div>
            <div class="list-items" id="listItems">
                <div style="text-align:center;padding:40px;color:#c7c7cc;font-size:13px;">暂无记录</div>
            </div>
        </div>

        <!-- ========== 看看（分析页，保留 V0.1） ========== -->
        <div class="page" id="page-analysis">
            <div class="analysis-summary">
                <div class="analysis-card">
                    <div class="label">收入</div>
                    <div class="amount income" id="analysisIncome">¥0</div>
                </div>
                <div class="analysis-card">
                    <div class="label">支出</div>
                    <div class="amount expense" id="analysisExpense">¥0</div>
                </div>
                <div class="analysis-card">
                    <div class="label">结余</div>
                    <div class="amount balance" id="analysisBalance">¥0</div>
                </div>
            </div>
            <div class="month-nav">
                <span class="month-nav-btn" id="prevMonth">‹</span>
                <span class="month-nav-label" id="monthLabel">2026年8月</span>
                <span class="month-nav-btn" id="nextMonth">›</span>
            </div>
            <div class="recent-title" style="padding:0 16px;">支出分类统计</div>
            <div class="chart-placeholder" id="analysisChart">暂无数据</div>
            <div class="data-mgmt">
                <button class="data-mgmt-btn" id="exportBtn">📤 导出数据</button>
                <button class="data-mgmt-btn" id="importBtn">📥 导入数据</button>
            </div>
        </div>

        <!-- ========== 待还占位页 ========== -->
        <div class="page" id="page-debts">
            <div class="placeholder-page">
                <div class="icon">📋</div>
                <div class="text">待还功能即将上线</div>
            </div>
        </div>

        <!-- ========== 底部导航 ========== -->
        <div class="tab-bar">
            <div class="tab-item active" data-page="home">
                <span class="tab-icon">📒</span>
                <span class="tab-label">小账本</span>
            </div>
            <div class="tab-item" data-page="list">
                <span class="tab-icon">📋</span>
                <span class="tab-label">流水</span>
            </div>
            <div class="tab-add-wrap">
                <div class="tab-add" id="tabAddBtn">+</div>
            </div>
            <div class="tab-item" data-page="analysis">
                <span class="tab-icon">👀</span>
                <span class="tab-label">看看</span>
            </div>
            <div class="tab-item" data-page="debts">
                <span class="tab-icon">📌</span>
                <span class="tab-label">待还</span>
            </div>
        </div>

        <!-- ========== 编辑弹窗 ========== -->
        <div class="modal-overlay" id="editOverlay"></div>
        <div class="modal-content" id="editModal">
            <div class="modal-title">编辑流水</div>
            <div class="add-form" style="padding:0;">
                <div class="type-toggle" id="editTypeToggle">
                    <div class="type-btn" data-type="expense">支出</div>
                    <div class="type-btn" data-type="income">收入</div>
                </div>
                <div class="amount-input-wrap">
                    <input type="number" id="editAmount" inputmode="decimal" placeholder="0.00" step="0.01">
                </div>
                <div class="category-grid" id="editCategories">
                    <div class="category-btn" data-cat="necessities_food"><span class="icon">🍚</span>温饱</div>
                    <div class="category-btn" data-cat="treat_food"><span class="icon">🍰</span>贪吃</div>
                    <div class="category-btn" data-cat="shopping"><span class="icon">🛍️</span>买买</div>
                    <div class="category-btn" data-cat="transport"><span class="icon">🚗</span>出行</div>
                    <div class="category-btn" data-cat="learning"><span class="icon">📚</span>学习</div>
                    <div class="category-btn" data-cat="household"><span class="icon">🏠</span>家用</div>
                    <div class="category-btn" data-cat="health"><span class="icon">💊</span>健康</div>
                    <div class="category-btn" data-cat="fun"><span class="icon">🎮</span>玩乐</div>
                </div>
                <div class="form-row">
                    <label>日期</label>
                    <input type="date" id="editDate">
                </div>
                <div class="form-row">
                    <label>备注</label>
                    <input type="text" id="editNote" placeholder="可选">
                </div>
                <div class="modal-actions">
                    <button class="cancel-btn" onclick="closeEditModal()">取消</button>
                    <button class="confirm-btn" id="editSaveBtn">保存</button>
                </div>
            </div>
        </div>

        <!-- ========== 删除确认弹窗 ========== -->
        <div class="modal-overlay" id="confirmOverlay"></div>
        <div class="modal-content" id="confirmModal" style="max-width:300px;left:50%;transform:translateX(-50%);border-radius:16px;">
            <div class="modal-title" id="confirmTitle">确认删除？</div>
            <div style="text-align:center;color:#8e8e93;font-size:13px;margin-bottom:16px;" id="confirmMsg">此操作不可撤销</div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeConfirmModal()">取消</button>
                <button class="confirm-btn danger" id="confirmDeleteBtn">删除</button>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        // ==================== Service Worker 注册 ====================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(function(reg) {
                reg.onupdatefound = function() {
                    var installing = reg.installing;
                    if (installing) {
                        installing.onstatechange = function() {
                            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                                // 新版本已安装，提示刷新
                                if (confirm('小账本已更新，刷新后使用新版本？')) {
                                    window.location.reload();
                                }
                            }
                        };
                    }
                };
            }).catch(function(err) {
                console.error('SW 注册失败:', err);
            });
        }

        // ==================== 页面切换 ====================
        var pageNames = ['home', 'add', 'list', 'analysis', 'debts'];
        var headerTitles = {
            home: '小账本', add: '记一笔', list: '流水', analysis: '看看', debts: '待还'
        };

        var tabItems = document.querySelectorAll('.tab-item');
        var pages = document.querySelectorAll('.page');
        var headerTitle = document.getElementById('headerTitle');

        function switchPage(pageId) {
            pages.forEach(function(p) { p.classList.remove('active'); });
            document.getElementById('page-' + pageId).classList.add('active');

            tabItems.forEach(function(t) { t.classList.remove('active'); });
            var tab = document.querySelector('.tab-item[data-page="' + pageId + '"]');
            if (tab) tab.classList.add('active');

            // 切到首页时刷新数据
            if (pageId === 'home') refreshHome();
            if (pageId === 'list') refreshList();
            if (pageId === 'analysis') refreshAnalysis();
        }

        // Tab 点击切换
        tabItems.forEach(function(tab) {
            tab.addEventListener('click', function() {
                var pageId = this.getAttribute('data-page');
                switchPage(pageId);
            });
        });

        // 中间 + 按钮
        document.getElementById('tabAddBtn').addEventListener('click', function() {
            switchPage('add');
            // 聚焦金额输入
            setTimeout(function() {
                var ai = document.getElementById('amountInput');
                if (ai) ai.focus();
            }, 300);
        });

        // 待还入口点击
        document.getElementById('debtEntry').addEventListener('click', function() {
            switchPage('debts');
        });

        // ==================== 记一笔：类型切换 ====================
        var typeBtns = document.querySelectorAll('#page-add .type-btn');
        typeBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                typeBtns.forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
            });
        });

        // ==================== 记一笔：默认日期 ====================
        var dateInput = document.getElementById('dateInput');
        if (dateInput) {
            var today = new Date();
            var y = today.getFullYear();
            var m = String(today.getMonth() + 1).padStart(2, '0');
            var d = String(today.getDate()).padStart(2, '0');
            dateInput.value = y + '-' + m + '-' + d;
        }

        // ==================== 记一笔：分类点击 ====================
        var catBtns = document.querySelectorAll('#page-add .category-btn');
        catBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                catBtns.forEach(function(b) { b.classList.remove('selected'); });
                this.classList.add('selected');
            });
        });

        // ==================== 记一笔：保存 ====================
        document.getElementById('saveBtn').addEventListener('click', function() {
            var typeEl = document.querySelector('#page-add .type-btn.active');
            var type = typeEl ? typeEl.getAttribute('data-type') : 'expense';
            var amount = parseFloat(document.getElementById('amountInput').value);
            if (!amount || amount <= 0) { alert('请输入金额'); return; }

            var catEl = document.querySelector('#page-add .category-btn.selected');
            var category = catEl ? catEl.getAttribute('data-cat') : 'necessities_food';

            var date = document.getElementById('dateInput').value || '';
            var note = document.getElementById('noteInput').value || '';

            var record = {
                type: type,
                amount: amount,
                category: category,
                date: date,
                note: note
            };

            addRecord(record).then(function() {
                // 清空表单
                document.getElementById('amountInput').value = '';
                document.getElementById('noteInput').value = '';
                // 重置日期为今天
                var now = new Date();
                document.getElementById('dateInput').value =
                    now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0');
                switchPage('home');
            }).catch(function(err) {
                alert('保存失败: ' + err);
            });
        });

        // ==================== 首页数据刷新 ====================
        function refreshHome() {
            // 更新月份显示
            var now = new Date();
            document.getElementById('homeMonth').textContent = now.getMonth() + 1 + '月';

            getHomeData().then(function(data) {
                // 本月总支出
                document.getElementById('homeTotalExpense').innerHTML =
                    '<span class="unit">¥</span>' + data.totalExpense.toFixed(2);

                // 还能用（暂不计算）
                document.getElementById('homeRemaining').textContent = '—';

                // 四个归属
                var ownerStats = data.ownerStats;
                var ownerItems = document.querySelectorAll('#ownerSection .owner-item');
                ownerItems.forEach(function(item) {
                    var owner = item.getAttribute('data-owner');
                    var amt = ownerStats[owner] || 0;
                    item.querySelector('.amount').textContent = '¥' + amt.toFixed(2);
                });

                // 如果存在未归类支出，添加未归类项
                var unclassified = ownerStats.unclassified || 0;
                var existingUnclassified = document.querySelector('.owner-item.unclassified');
                if (unclassified > 0 && !existingUnclassified) {
                    var unclEl = document.createElement('div');
                    unclEl.className = 'owner-item unclassified';
                    unclEl.innerHTML = '<div class="name">未归类</div><div class="amount">¥' + unclassified.toFixed(2) + '</div>';
                    document.getElementById('ownerSection').appendChild(unclEl);
                } else if (unclassified > 0 && existingUnclassified) {
                    existingUnclassified.querySelector('.amount').textContent = '¥' + unclassified.toFixed(2);
                } else if (existingUnclassified) {
                    existingUnclassified.remove();
                }

                // 待还
                var debtSummary = data.debtSummary;
                document.getElementById('debtTotal').textContent = '¥' + (debtSummary.totalRemaining || 0).toFixed(2);
                document.getElementById('debtMonthly').textContent = '¥' + (debtSummary.monthlyDue || 0).toFixed(2);

                // 最近记下
                var recentRecords = data.recentRecords;
                var recentList = document.getElementById('recentList');
                if (recentRecords.length === 0) {
                    recentList.innerHTML = '<div class="recent-empty">还没有记录，记一笔吧</div>';
                } else {
                    var html = '';
                    var count = 0;
                    recentRecords.forEach(function(r) {
                        if (count >= 5) return;
                        count++;
                        var catDisplay = getCategoryDisplay(r.category);
                        var ownerDisplay = r.owner ? getOwnerDisplay(r.owner) : '未归类';
                        var dateStr = r.date ? r.date.substring(5) : '';
                        var sign = r.type === 'income' ? '+' : '-';
                        html +=
                            '<div class="recent-item">' +
                                '<div class="recent-item-left">' +
                                    '<div class="recent-item-category">' + catDisplay + ' · ' + ownerDisplay + '</div>' +
                                    '<div class="recent-item-meta">' + (r.note || '') + (r.note && dateStr ? ' · ' : '') + dateStr + '</div>' +
                                '</div>' +
                                '<div class="recent-item-amount">' + sign + '¥' + Number(r.amount).toFixed(2) + '</div>' +
                            '</div>';
                    });
                    recentList.innerHTML = html;
                }
            });
        }

        // ==================== 流水页刷新 ====================
        var currentFilter = 'all';

        document.querySelectorAll('.filter-chip').forEach(function(chip) {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                refreshList();
            });
        });

        function refreshList() {
            getRecordsByType(currentFilter).then(function(records) {
                var container = document.getElementById('listItems');
                if (records.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:40px;color:#c7c7cc;font-size:13px;">暂无记录</div>';
                    return;
                }
                var html = '';
                records.forEach(function(r) {
                    var catDisplay = getCategoryDisplay(r.category);
                    var ownerDisplay = r.owner ? getOwnerDisplay(r.owner) : '未归类';
                    var dateStr = r.date || '';
                    var sign = r.type === 'income' ? '+' : '-';
                    var cls = r.type === 'income' ? 'income' : 'expense';
                    html +=
                        '<div class="list-item" data-id="' + r.id + '">' +
                            '<div class="list-item-left">' +
                                '<div class="list-item-category">' + catDisplay + ' · ' + ownerDisplay + '</div>' +
                                '<div class="list-item-meta">' + (r.note ? r.note + ' · ' : '') + dateStr + '</div>' +
                            '</div>' +
                            '<div class="list-item-amount ' + cls + '">' + sign + '¥' + Number(r.amount).toFixed(2) + '</div>' +
                            '<div class="list-item-actions">' +
                                '<button class="item-btn edit" onclick="openEditModal(' + r.id + ')">✏️</button>' +
                                '<button class="item-btn delete" onclick="openDeleteConfirm(' + r.id + ')">🗑️</button>' +
                            '</div>' +
                        '</div>';
                });
                container.innerHTML = html;
            });
        }

        // ==================== 编辑弹窗 ====================
        var editingId = null;

        function openEditModal(id) {
            editingId = id;
            getAllRecords().then(function(records) {
                var record = null;
                for (var i = 0; i < records.length; i++) {
                    if (records[i].id === id) { record = records[i]; break; }
                }
                if (!record) return;

                // 设置类型
                var editTypes = document.querySelectorAll('#editTypeToggle .type-btn');
                editTypes.forEach(function(b) {
                    b.classList.toggle('active', b.getAttribute('data-type') === record.type);
                });

                document.getElementById('editAmount').value = record.amount;
                document.getElementById('editDate').value = record.date || '';
                document.getElementById('editNote').value = record.note || '';

                // 设置分类
                var editCats = document.querySelectorAll('#editCategories .category-btn');
                editCats.forEach(function(b) {
                    b.classList.toggle('selected', b.getAttribute('data-cat') === record.category);
                });

                document.getElementById('editModal').classList.add('active');
                document.getElementById('editOverlay').classList.add('active');
            });
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            document.getElementById('editOverlay').classList.remove('active');
            editingId = null;
        }

        document.getElementById('editOverlay').addEventListener('click', closeEditModal);

        document.getElementById('editSaveBtn').addEventListener('click', function() {
            if (!editingId) return;
            var typeEl = document.querySelector('#editTypeToggle .type-btn.active');
            var type = typeEl ? typeEl.getAttribute('data-type') : 'expense';
            var amount = parseFloat(document.getElementById('editAmount').value);
            if (!amount || amount <= 0) { alert('请输入金额'); return; }

            var catEl = document.querySelector('#editCategories .category-btn.selected');
            var category = catEl ? catEl.getAttribute('data-cat') : 'necessities_food';
            var date = document.getElementById('editDate').value || '';
            var note = document.getElementById('editNote').value || '';

            // 先获取原记录保持 owner 等字段完整
            getAllRecords().then(function(records) {
                var original = null;
                for (var i = 0; i < records.length; i++) {
                    if (records[i].id === editingId) { original = records[i]; break; }
                }
                if (!original) return;

                original.type = type;
                original.amount = amount;
                original.category = category;
                original.date = date;
                original.note = note;

                updateRecord(original).then(function() {
                    closeEditModal();
                    refreshList();
                    refreshHome();
                }).catch(function(err) {
                    alert('更新失败: ' + err);
                });
            });
        });

        // ==================== 删除确认 ====================
        var deletingId = null;

        function openDeleteConfirm(id) {
            deletingId = id;
            document.getElementById('confirmModal').classList.add('active');
            document.getElementById('confirmOverlay').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            document.getElementById('confirmOverlay').classList.remove('active');
            deletingId = null;
        }

        document.getElementById('confirmOverlay').addEventListener('click', closeConfirmModal);

        document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
            if (!deletingId) return;
            deleteRecord(deletingId).then(function() {
                closeConfirmModal();
                refreshList();
                refreshHome();
            }).catch(function(err) {
                alert('删除失败: ' + err);
            });
        });

        // ==================== 分析页面 ====================
        var analysisMonth = new Date();
        var analysisMonthStr = analysisMonth.getFullYear() + '-' +
            String(analysisMonth.getMonth() + 1).padStart(2, '0');

        document.getElementById('prevMonth').addEventListener('click', function() {
            analysisMonth.setMonth(analysisMonth.getMonth() - 1);
            analysisMonthStr = analysisMonth.getFullYear() + '-' +
                String(analysisMonth.getMonth() + 1).padStart(2, '0');
            refreshAnalysis();
        });

        document.getElementById('nextMonth').addEventListener('click', function() {
            analysisMonth.setMonth(analysisMonth.getMonth() + 1);
            analysisMonthStr = analysisMonth.getFullYear() + '-' +
                String(analysisMonth.getMonth() + 1).padStart(2, '0');
            refreshAnalysis();
        });

        function refreshAnalysis() {
            document.getElementById('monthLabel').textContent =
                analysisMonth.getFullYear() + '年' + (analysisMonth.getMonth() + 1) + '月';

            getMonthSummaryByMonth(analysisMonthStr).then(function(summary) {
                document.getElementById('analysisIncome').textContent = '¥' + summary.income.toFixed(2);
                document.getElementById('analysisExpense').textContent = '¥' + summary.expense.toFixed(2);
                document.getElementById('analysisBalance').textContent = '¥' + summary.balance.toFixed(2);
            });

            getCategoryStatsByMonth(analysisMonthStr).then(function(result) {
                var stats = result.stats;
                var total = result.total;
                var container = document.getElementById('analysisChart');
                var keys = Object.keys(stats);
                if (keys.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:40px;color:#c7c7cc;font-size:13px;">暂无数据</div>';
                    return;
                }
                // 按金额排序
                keys.sort(function(a, b) { return (stats[b] || 0) - (stats[a] || 0); });
                var html = '';
                keys.forEach(function(cat) {
                    var pct = total > 0 ? (stats[cat] / total * 100).toFixed(1) : 0;
                    var displayCat = getCategoryDisplay(cat);
                    html +=
                        '<div style="margin-bottom:12px;">' +
                            '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">' +
                                '<span>' + displayCat + '</span>' +
                                '<span>¥' + stats[cat].toFixed(2) + ' (' + pct + '%)</span>' +
                            '</div>' +
                            '<div style="height:8px;background:#e8ecf0;border-radius:4px;overflow:hidden;">' +
                                '<div style="height:100%;width:' + pct + '%;background:#5b8def;border-radius:4px;transition:width 0.3s;"></div>' +
                            '</div>' +
                        '</div>';
                });
                html += '<div style="text-align:right;font-size:12px;color:#c7c7cc;margin-top:8px;">总支出 ¥' + total.toFixed(2) + '</div>';
                container.innerHTML = html;
            });
        }

        // ==================== 导出/导入 ====================
        document.getElementById('exportBtn').addEventListener('click', function() {
            exportAllData().then(function(json) {
                var now = new Date();
                var fname = '小账本备份_' + now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0') + '.json';
                var blob = new Blob([json], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url; a.download = fname; a.click();
                URL.revokeObjectURL(url);
            }).catch(function(err) {
                alert('导出失败: ' + err);
            });
        });

        document.getElementById('importBtn').addEventListener('click', function() {
            var input = document.createElement('input');
            input.type = 'file'; input.accept = '.json';
            input.onchange = function(e) {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function(ev) {
                    var jsonStr = ev.target.result;
                    try {
                        var data = JSON.parse(jsonStr);
                        var isV02 = (data.version === '0.2') || Object.prototype.hasOwnProperty.call(data, 'debts');
                        var records = data.records || data;
                        var count = records.length;
                        var debtCount = data.debts ? data.debts.length : 0;

                        var msg = '即将导入 ' + count + ' 条流水';
                        if (isV02) {
                            msg += ' + ' + debtCount + ' 条待还';
                            msg += '，当前数据将完全覆盖';
                        } else {
                            msg += '（V0.1 备份，不影响当前待还数据）';
                        }

                        if (!confirm(msg + '，确认继续？')) return;

                        importRecords(jsonStr).then(function(result) {
                            alert(result);
                            refreshHome();
                            refreshList();
                            refreshAnalysis();
                        }).catch(function(err) {
                            alert('导入失败: ' + err);
                        });
                    } catch(e) {
                        alert('文件格式错误');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        });

        // ==================== 工具函数 ====================
        function formatDate(dateStr) {
            if (!dateStr) return '';
            var parts = dateStr.split('-');
            return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
        }

        // ==================== 初始化 ====================
        refreshHome();
    </script>
</body>
</html>
